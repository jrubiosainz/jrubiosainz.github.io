<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>room viewer (dev)</title>
<base href="/">
<style>
  html, body { margin: 0; height: 100%; background: #07080d; color: #ddd; font: 12px ui-monospace, monospace; overflow: hidden; }
  canvas { display: block; }
  #info { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 6px; pointer-events: none; white-space: pre; }
  #ctl { position: fixed; right: 8px; top: 8px; background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 6px; }
  #ctl label { display: grid; grid-template-columns: 70px 150px 40px; gap: 6px; align-items: center; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="info">loading…</div>
<div id="ctl"></div>
<script type="module">
import * as THREE from 'three';
import { loadRoom } from '/js/scene/room.js';
import { LIGHTS } from '/js/scene/materials.js';
import { createWindowView } from '/js/scene/window.js';

const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26.4, innerWidth / innerHeight, 0.02, 60);
const info = document.getElementById('info');
const t0 = performance.now();
const room = await loadRoom({ renderer, onProgress: (p) => { info.textContent = `loading ${(p * 100) | 0}%`; } });
scene.add(room.scene);
const win = await createWindowView({ renderer, basePath: 'assets/window/' });
const wv = room.byName.get('Window_View');
wv?.traverse((o) => { if (o.isMesh) { o.material = win.material; o.visible = true; } });
// temporary: TV screen solid blue glow
const tvColor = new THREE.Color(0.18, 0.3, 1.0);
room.specials.filter((s) => s.role === 'tv_screen').forEach((s) => { s.mesh.material.uniforms.uColor.value.copy(tvColor); s.mesh.material.uniforms.uStrength.value = 1.2; });
const view = room.views[params.get('view') || 'Cam_Home'] || room.views.Cam_Home;
camera.position.copy(view.pos);
camera.lookAt(view.target);
camera.fov = view.fov;
camera.updateProjectionMatrix();
info.textContent = `loaded in ${((performance.now() - t0) / 1000).toFixed(2)}s  views: ${Object.keys(room.views).join(', ')}`;
const ctl = document.getElementById('ctl');
const sliders = { exposure: [0, 4, 1.0], amb: [0, 3, 1], lamp: [0, 3, 1], tv: [0, 3, 1] };
const vals = {};
for (const [k, [a, b, v]] of Object.entries(sliders)) {
  const lab = document.createElement('label');
  lab.innerHTML = `<span>${k}</span><input type=range min=${a} max=${b} step=0.01 value=${params.get(k) ?? v}><output>${params.get(k) ?? v}</output>`;
  const inp = lab.querySelector('input');
  vals[k] = Number(inp.value);
  inp.oninput = () => { vals[k] = Number(inp.value); lab.querySelector('output').textContent = inp.value; };
  ctl.appendChild(lab);
}
let yaw = 0, pitch = 0, drag = null;
addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY, yaw, pitch]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => { if (!drag) return; yaw = drag[2] - (e.clientX - drag[0]) * 0.003; pitch = drag[3] - (e.clientY - drag[1]) * 0.003; });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const base = new THREE.Quaternion().copy(camera.quaternion);
let frames = 0, last = performance.now();
renderer.setAnimationLoop((t) => {
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  camera.quaternion.copy(base).multiply(q);
  LIGHTS.ambK.value = vals.amb;
  LIGHTS.lampK.value = vals.lamp;
  LIGHTS.tvK.value.copy(tvColor).multiplyScalar(vals.tv * 0.35 / (room.lmMeta.tv_bake_strength || 1));
  renderer.toneMappingExposure = vals.exposure;
  win.update(t / 1000, 1 / 60, camera);
  renderer.render(scene, camera);
  frames++;
  if (t - last > 1000) { document.title = `${frames} fps`; frames = 0; last = t; }
});
window.__room = room;
window.__ready = true;
</script>
</body>
</html>
