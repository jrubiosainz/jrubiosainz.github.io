<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Window city/rain shader</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; color: #f2e6cf; font: 13px/1.4 system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .panel {
      position: fixed; left: 14px; bottom: 14px; width: 300px; padding: 12px 14px;
      background: rgba(10, 12, 17, .76); border: 1px solid rgba(255, 202, 126, .25);
      box-shadow: 0 10px 35px rgba(0,0,0,.45); backdrop-filter: blur(10px); border-radius: 8px;
    }
    label { display: grid; grid-template-columns: 82px 1fr 42px; gap: 8px; align-items: center; margin: 6px 0; }
    input[type="range"] { width: 100%; }
    button { margin-top: 8px; color: #221508; background: #ffbc68; border: 0; border-radius: 5px; padding: 6px 10px; font-weight: 700; }
    .hint { color: #baa88f; margin-top: 8px; font-size: 12px; }
  </style>
  <script type="importmap">
  {"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}
  </script>
</head>
<body>
  <div class="panel">
    <label>Rain <input id="rain" type="range" min="0" max="2" step="0.01" value="1"><span id="rainv">1.00</span></label>
    <label>Exposure <input id="exposure" type="range" min="0.35" max="2.2" step="0.01" value="0.86"><span id="exposurev">0.86</span></label>
    <label>Lights <input id="boost" type="range" min="0" max="5" step="0.05" value="1.25"><span id="boostv">1.25</span></label>
    <label>Time <input id="timescale" type="range" min="0" max="8" step="0.05" value="1"><span id="timescalev">1.00</span></label>
    <button id="flash">Lightning</button>
    <div class="hint">Drag to move ±0.8 m and yaw ±50°. The quad uses the real window opening at z = -0.82.</div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { createWindowView } from '../js/scene/window.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070b);
    const camera = new THREE.PerspectiveCamera(26.3, innerWidth / innerHeight, 0.02, 100);
    const home = new THREE.Vector3(0.02, 1.08, 1.90);
    const target = new THREE.Vector3(0, 1.08, -0.82);
    camera.position.copy(home);
    camera.lookAt(target);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.82, 0.48, 0.62);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    const windowView = await createWindowView({
      renderer,
      basePath: '../assets/window/',
      quality: 'high',
      onLightning: delay => console.log(`thunder in ${delay.toFixed(1)}s`),
    });
    windowView.material.uniforms.uExposure.value = 0.86;
    windowView.material.uniforms.uLightBoost.value = 1.25;

    const openingW = 1.32;
    const openingH = 1.40;
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(openingW, openingH, 1, 1), windowView.material);
    pane.position.set((-0.74 + 0.58) * 0.5, (0.90 + 2.30) * 0.5, -0.82);
    scene.add(pane);

    const frameMat = new THREE.MeshBasicMaterial({ color: 0x17100b });
    function bar(name, x, y, sx, sy) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, 0.055), frameMat);
      m.name = name;
      m.position.set(x, y, -0.78);
      scene.add(m);
    }
    const cx = pane.position.x, cy = pane.position.y;
    bar('Frame_L', -0.79, cy, 0.08, openingH + 0.18);
    bar('Frame_R', 0.63, cy, 0.08, openingH + 0.18);
    bar('Frame_T', cx, 2.35, openingW + 0.18, 0.08);
    bar('Frame_B', cx, 0.85, openingW + 0.18, 0.08);
    bar('Mullion_C', cx, cy, 0.045, openingH + 0.04);
    bar('Transom_C', cx, 1.66, openingW + 0.06, 0.04);

    const roomMat = new THREE.MeshBasicMaterial({ color: 0x0e0b0a });
    const sill = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.12, 0.35), roomMat);
    sill.position.set(cx, 0.80, -0.70);
    scene.add(sill);

    const lamp = new THREE.PointLight(0xffa04a, 0.6, 3.0);
    lamp.position.set(-0.72, 0.92, 0.50);
    scene.add(lamp);

    const state = { drag: false, x: 0, y: 0, yaw: 0, offset: new THREE.Vector2() };
    renderer.domElement.addEventListener('pointerdown', e => { state.drag = true; state.x = e.clientX; state.y = e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
    renderer.domElement.addEventListener('pointerup', e => { state.drag = false; renderer.domElement.releasePointerCapture(e.pointerId); });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!state.drag) return;
      const dx = (e.clientX - state.x) / innerWidth;
      const dy = (e.clientY - state.y) / innerHeight;
      state.offset.x = THREE.MathUtils.clamp(dx * 1.6, -0.8, 0.8);
      state.offset.y = THREE.MathUtils.clamp(-dy * 0.7, -0.35, 0.35);
      state.yaw = THREE.MathUtils.clamp(dx * THREE.MathUtils.degToRad(100), -THREE.MathUtils.degToRad(50), THREE.MathUtils.degToRad(50));
    });

    const controls = ['rain', 'exposure', 'boost', 'timescale'];
    for (const id of controls) {
      const el = document.getElementById(id);
      const out = document.getElementById(`${id}v`);
      el.addEventListener('input', () => { out.textContent = Number(el.value).toFixed(2); });
    }
    document.getElementById('flash').addEventListener('click', () => windowView.flash());

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    let lastNow = performance.now();
    let t = 0;
    function frame() {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastNow) / 1000);
      lastNow = now;
      const scale = Number(document.getElementById('timescale').value);
      t += dt * scale;
      windowView.setRain(Number(document.getElementById('rain').value));
      windowView.material.uniforms.uExposure.value = Number(document.getElementById('exposure').value);
      windowView.material.uniforms.uLightBoost.value = Number(document.getElementById('boost').value);
      const pos = home.clone().add(new THREE.Vector3(state.offset.x, state.offset.y, 0));
      camera.position.lerp(pos, 0.12);
      const look = target.clone().add(new THREE.Vector3(Math.sin(state.yaw) * 2.1, state.offset.y * 0.25, 0));
      camera.lookAt(look);
      windowView.update(t, dt, camera);
      composer.render();
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
