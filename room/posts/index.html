  <script type="module">
    import content from '../js/content.js';

    const list = document.getElementById('posts-list');
    const count = document.getElementById('archive-count');
    const name = document.getElementById('site-name');
    name.textContent = content.site.name;
    count.textContent = `${content.posts.length} items`;

    const dateFmt = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    list.replaceChildren(...content.posts.map((post) => {
      const article = document.createElement('article');
      article.className = `post-card${post.url === '#' ? ' is-placeholder' : ''}`;

      const time = document.createElement('time');
      time.className = 'post-date';
      time.dateTime = post.date;
      time.textContent = dateFmt.format(new Date(`${post.date}T00:00:00Z`)).replace(',', '');

      const body = document.createElement('div');
      const h2 = document.createElement('h2');
      const link = document.createElement('a');
      const external = /^[a-z]+:/i.test(post.url);
      link.href = external || post.url.startsWith('#') ? post.url : `../${post.url}`;
      link.textContent = external ? `${post.title} ↗` : post.title;
      if (external) { link.target = '_blank'; link.rel = 'noopener'; }
      h2.append(link);
      const p = document.createElement('p');
      p.textContent = post.excerpt;
      body.append(h2, p);
      article.append(time, body);
      return article;
    }));
  </script>
